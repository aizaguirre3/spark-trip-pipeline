name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JavaScript actions into Node.js 24 ahead of GitHub's June 2026
# forced upgrade. actions/checkout@v4, setup-java@v4, setup-python@v5
# are the latest majors and don't yet publish a Node-24-native release;
# this env var is GitHub's official opt-in path until they do.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
